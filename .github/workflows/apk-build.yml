
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Supabase build job ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_ID: ${{ inputs.job_id }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install image tools
        run: python3 -m pip install Pillow

      - name: Prepare app
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.parse, shutil
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          job_id = os.environ["JOB_ID"]

          if not base or not key or not job_id:
              raise SystemExit("Missing Supabase configuration.")

          headers = {
              "apikey": key,
              "Authorization": "Bearer " + key,
              "Content-Type": "application/json"
          }

          def request(url, method="GET", data=None, extra=None):
              h = dict(headers)
              if extra:
                  h.update(extra)
              body = data
              if isinstance(data, (dict, list)):
                  body = json.dumps(data).encode()
              req = urllib.request.Request(
                  url, data=body, headers=h, method=method
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()

          query = urllib.parse.urlencode({
              "id": "eq." + job_id,
              "select": (
                  "id,user_id,app_name,publisher,version,package_id,"
                  "website_url,html_path,logo_path,fullscreen,"
                  "allow_screenshots,allow_internet,include_readme,status"
              )
          })

          rows = json.loads(request(
              base + "/rest/v1/apk_build_jobs?" + query
          ))
          if len(rows) != 1:
              raise SystemExit("Build job not found.")

          job = rows[0]
          app_name = job.get("app_name")
          version = job.get("version")
          package_id = job.get("package_id")
          website_url = (job.get("website_url") or "").strip()
          html_path = job.get("html_path")
          logo_path = job.get("logo_path")

          if not isinstance(app_name, str) or not app_name.strip():
              raise SystemExit("Missing app name.")
          if not isinstance(version, str) or not re.fullmatch(
              r"[0-9]+(\.[0-9]+){0,3}", str(version)
          ):
              raise SystemExit("Invalid app version.")
          if not isinstance(package_id, str) or not re.fullmatch(
              r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+",
              package_id
          ):
              raise SystemExit("Invalid package ID.")

          # Accept one website URL OR one uploaded HTML file.
          if bool(website_url) == bool(html_path):
              raise SystemExit(
                  "Provide exactly one input: HTTPS URL or HTML file."
              )

          if website_url:
              parsed = urllib.parse.urlparse(website_url)
              if parsed.scheme != "https" or not parsed.hostname:
                  raise SystemExit("Website URL must use HTTPS.")

          request(
              base + "/rest/v1/apk_build_jobs?id=eq." + job_id,
              "PATCH",
              {"status": "building", "error_message": None},
              {"Prefer": "return=minimal"}
          )

          def storage_download(path):
              if not path:
                  raise SystemExit("Missing uploaded file path.")
              encoded = urllib.parse.quote(path, safe="/")
              return request(
                  base + "/storage/v1/object/apk-builds/" + encoded
              )

          assets = Path("app/src/main/assets")
          if assets.exists():
              shutil.rmtree(assets)
          assets.mkdir(parents=True)

          if html_path:
              html = storage_download(html_path)
              if not html.strip():
                  raise SystemExit("HTML file is empty.")
              (assets / "index.html").write_bytes(html)

          # The activity reads this configuration on app startup.
          config = {
              "website_url": website_url,
              "fullscreen": bool(job.get("fullscreen", False)),
              "allow_screenshots": bool(
                  job.get("allow_screenshots", True)
              ),
              "allow_internet": bool(job.get("allow_internet", True))
          }
          (assets / "build-config.json").write_text(
              json.dumps(config), encoding="utf-8"
          )

          if job.get("include_readme", True):
              (assets / "README.txt").write_text(
                  app_name + "\nVersion: " + version +
                  "\nGenerated by HTML to APK Converter.\n",
                  encoding="utf-8"
              )

          # Update Gradle app ID and version.
          gradle = Path("app/build.gradle")
          if not gradle.exists():
              raise SystemExit("app/build.gradle not found.")
          text = gradle.read_text(encoding="utf-8")

          text, n1 = re.subn(
              r"""applicationId\s+(['"])[^'"]*\1""",
              lambda m: 'applicationId "' + package_id + '"',
              text, count=1
          )
          text, n2 = re.subn(
              r"""versionName\s+(['"])[^'"]*\1""",
              lambda m: 'versionName "' + version + '"',
              text, count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  "Could not update applicationId/versionName in app/build.gradle."
              )
          gradle.write_text(text, encoding="utf-8")

          # Generate launcher icons.
          if logo_path:
              try:
                  source = Image.open(
                      BytesIO(storage_download(logo_path))
                  ).convert("RGBA")
                  source.load()
              except Exception as e:
                  raise SystemExit("Invalid PNG logo: " + str(e))
          else:
              source = Image.new("RGBA", (512, 512), (20, 20, 20, 255))

          fitted = ImageOps.contain(
              source, (448, 448), method=Image.Resampling.LANCZOS
          )
          icon = Image.new("RGBA", (512, 512), (20, 20, 20, 255))
          icon.alpha_composite(
              fitted,
              ((512 - fitted.width) // 2, (512 - fitted.height) // 2)
          )

          res = Path("app/src/main/res")
          for folder, size in {
              "mipmap-mdpi": 48, "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)
              resized = icon.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              resized.save(directory / "ic_launcher.png")
              resized.save(directory / "ic_launcher_round.png")

          # Set app label and icon in the manifest.
          import xml.etree.ElementTree as ET
          manifest = Path("app/src/main/AndroidManifest.xml")
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          root = ET.parse(manifest).getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Manifest application element missing.")
          app.set("{" + ns + "}label", app_name)
          app.set("{" + ns + "}icon", "@mipmap/ic_launcher")
          app.set("{" + ns + "}roundIcon", "@mipmap/ic_launcher_round")
          ET.ElementTree(root).write(
              manifest, encoding="utf-8", xml_declaration=True
          )

          # Generate MainActivity to read the build configuration.
          java_files = list(
              Path("app/src/main/java").rglob("MainActivity.java")
          )
          if len(java_files) != 1:
              raise SystemExit(
                  "Expected exactly one MainActivity.java under app/src/main/java."
              )

          java_file = java_files[0]
          package_line = re.search(
              r"^\s*package\s+[\w.]+\s*;",
              java_file.read_text(encoding="utf-8"),
              re.MULTILINE
          )
          if not package_line:
              raise SystemExit("Cannot determine MainActivity package.")
          package_decl = package_line.group(0).strip()

          activity = r'''
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.net.Uri;
          import org.json.JSONObject;
          import java.io.InputStream;
          import java.io.ByteArrayOutputStream;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  JSONObject config = new JSONObject();
                  try {
                      InputStream in = getAssets().open("build-config.json");
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buffer = new byte[4096];
                      int count;
                      while ((count = in.read(buffer)) != -1) {
                          out.write(buffer, 0, count);
                      }
                      in.close();
                      config = new JSONObject(out.toString("UTF-8"));
                  } catch (Exception ignored) {}

                  boolean fullscreen = config.optBoolean("fullscreen", false);
                  boolean screenshots = config.optBoolean("allow_screenshots", true);
                  boolean internet = config.optBoolean("allow_internet", true);
                  String url = config.optString("website_url", "");

                  if (fullscreen) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      );
                  }
                  if (!screenshots) {
                      getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                      );
                  }

                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          return !("https".equalsIgnoreCase(scheme)
                              || "http".equalsIgnoreCase(scheme)
                              || "file".equalsIgnoreCase(scheme)
                              || "about".equalsIgnoreCase(scheme));
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());

                  if (!internet && url.startsWith("https://")) {
                      webView.loadUrl("file:///android_asset/index.html");
                  } else if (url.startsWith("https://")) {
                      webView.loadUrl(url);
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          '''
          java_file.write_text(
              package_decl + "\n" + activity.strip() + "\n",
              encoding="utf-8"
          )

          print("Prepared app for URL or HTML input.")

          safe_name = re.sub(r"[^A-Za-z0-9_-]+", "-", app_name).strip("-")
          safe_version = re.sub(r"[^A-Za-z0-9._-]+", "-", version)
          filename = (safe_name or "MyApp") + "-v" + safe_version + ".apk"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APK_FILENAME=" + filename + "\n")
          PY

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK and mark complete
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          from pathlib import Path

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          job_id = os.environ["JOB_ID"]
          filename = os.environ["APK_FILENAME"]

          headers = {
              "apikey": key,
              "Authorization": "Bearer " + key,
              "Content-Type": "application/json"
          }

          def request(url, method="GET", data=None, extra=None):
              h = dict(headers)
              if extra:
                  h.update(extra)
              if isinstance(data, (dict, list)):
                  data = json.dumps(data).encode()
              req = urllib.request.Request(
                  url, data=data, headers=h, method=method
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()

          query = urllib.parse.urlencode({
              "id": "eq." + job_id,
              "select": "id,user_id"
          })
          rows = json.loads(request(
              base + "/rest/v1/apk_build_jobs?" + query
          ))
          if len(rows) != 1:
              raise SystemExit("Build job not found.")

          apk = Path(
              "app/build/outputs/apk/debug/app-debug.apk"
          )
          if not apk.exists() or apk.stat().st_size == 0:
              raise SystemExit("APK output is missing.")

          path = "outputs/{}/{}/{}".format(
              rows[0]["user_id"], job_id, filename
          )
          encoded = urllib.parse.quote(path, safe="/")
          request(
              base + "/storage/v1/object/apk-builds/" + encoded,
              "POST",
              apk.read_bytes(),
              {
                  "Content-Type": "application/vnd.android.package-archive",
                  "x-upsert": "true"
              }
          )
          request(
              base + "/rest/v1/apk_build_jobs?id=eq." + job_id,
              "PATCH",
              {"status": "complete", "apk_path": path, "error_message": None},
              {"Prefer": "return=minimal"}
          )
          print("APK uploaded successfully.")
          PY

      - name: Mark build failed
        if: failure()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          base = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          job = os.environ.get("JOB_ID", "")
          if base and key and job:
              data = json.dumps({
                  "status": "failed",
                  "error_message": "Build failed. Check GitHub Actions logs."
              }).encode()
              req = urllib.request.Request(
                  base + "/rest/v1/apk_build_jobs?id=eq." + job,
                  data=data,
                  method="PATCH",
                  headers={
                      "apikey": key,
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  r.read()
          PY
